name: Celebrate merge

# Live demo in the wild: GIF on merge, on close, and when a
# reviewer asks for more work. Checkout is the default branch
# only — never the pull request head. A no-cheer / skip-cheer
# label skips the comment. A second run on the same PR does not
# post another GIF. First-time authors get a welcome line.
on:
  pull_request_target:
    types: [closed]
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write

jobs:
  celebrate:
    if: >
      github.event.pull_request.user.type != 'Bot'
      && (
        github.event_name != 'pull_request_review'
        || (
          github.event.review.state == 'changes_requested'
          && github.event.review.user.type != 'Bot'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./
        with:
          model: gpt-4o-mini
          model-api-key: ${{ secrets.OPENAI_API_KEY }}
