name: Contributors

# The wall lives in readme-contributors as a reusable workflow and is written
# straight to main after every merge, with no separate pull request. It used
# to open a docs/contributors pull request and merge it, which put a bot PR in
# the history for every refresh and needed Actions to be allowed to create
# pull requests.
#
# main is protected, so the wall pushes through the write deploy key stored as
# CONTRIBUTORS_DEPLOY_KEY. `secrets: inherit` hands it over, along with
# OPENAI_API_KEY for the caption.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wall:
    uses: YauhenBichel/readme-contributors/.github/workflows/wall.yml@6102d1fa62437f9f04020fe53627d503ac3dd26e # v1.9.1
    with:
      format: html
      caption: auto
      model: gpt-4o-mini
    secrets: inherit
