name: Pages

# The default Actions token cannot create a Pages site. One-time, in a browser:
# https://github.com/YauhenBichel/merge-cheer/settings/pages
# Build and deployment → Source → GitHub Actions.
# Then re-run this workflow.

on:
  push:
    paths:
      - "docs/**"
      - "gifs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        id: pages
      - name: Explain a Setup Pages failure
        if: failure() && steps.pages.outcome == 'failure'
        run: |
          echo "Setup Pages failed. Open"
          echo "https://github.com/${GITHUB_REPOSITORY}/settings/pages"
          echo "and set Build and deployment -> Source -> GitHub Actions."
          echo "GITHUB_TOKEN cannot create the site itself."
      - name: Assemble site
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          cp docs/merge-cheer-demo.mp4 _site/merge-cheer-demo.mp4
          cp docs/merge-cheer-demo-poster.png _site/merge-cheer-demo-poster.png
          cp docs/merge-cheer-ai-demo.mp4 _site/merge-cheer-ai-demo.mp4
          cp docs/merge-cheer-ai-demo-poster.png _site/merge-cheer-ai-demo-poster.png
          cp docs/merge-cheer-ai-demo.gif _site/merge-cheer-ai-demo.gif
          cp docs/merge-cheer-ai-real.png _site/merge-cheer-ai-real.png
          cp -R gifs _site/gifs
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
