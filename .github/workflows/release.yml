name: Release

# Marketplace-facing GitHub Release + Docker Hub pipe image.
#
# 1. Tests run on the exact tagged commit (never a pull request head).
# 2. Job `release` needs those tests and the `marketplace` environment.
#    The owner must add Required reviewers under
#    Settings → Environments → marketplace, or this job will not pause.
# 3. Job `docker` pushes <hub-user>/merge-cheer:<semver> after Release.
#    Requires secrets DOCKERHUB_USERNAME + DOCKERHUB_TOKEN.
# 4. GitHub has no API for the Marketplace checkbox. After release,
#    open the printed edit URL and tick Publish on the first listing only.
#
# Semver tags only (vMAJOR.MINOR.PATCH). This workflow never force-moves v1.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing semver tag to release (vMAJOR.MINOR.PATCH, for example v1.2.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Require a semver tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          echo "Releasing ${VERSION} (semver only; v1 is not a ship tag here)."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Tests
        run: python3 -m unittest discover -s tests -q

  release:
    needs: test
    environment: marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="$VERSION"
          PREV="$(
            git tag --list --sort=-v:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | grep -vx "$TAG" \
              | head -n1 || true
          )"
          {
            echo "Topic groups pick a GIF from the pull request title."
            echo "Zero-config: bundled G-rated GIFs, no Giphy key."
            echo
            if [ -n "$PREV" ]; then
              echo "## Changes since ${PREV}"
              echo
              # No merge commits, and none of the wall's own refresh commits:
              # a reader wants what changed, not how it got here. `|| true`
              # because grep exits 1 when it filters everything out, and
              # pipefail would take the step down with it.
              git log --no-merges --pretty=format:'- %s' "${PREV}..${TAG}" \
                | grep -vE '^- (docs: refresh README contributors|Merge pull request)' || true
              echo
            else
              echo "## Changes"
              echo
              git log --no-merges --pretty=format:'- %s' "$TAG" \
                | grep -vE '^- (docs: refresh README contributors|Merge pull request)' || true
              echo
            fi
          } > "${RUNNER_TEMP}/notes.md"

          # Idempotent: a parallel create, manual publish, or re-run must not
          # fail the marketplace environment when the Release already exists.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Merge Cheer ${TAG}" \
              --notes-file "${RUNNER_TEMP}/notes.md"
            echo "Release ${TAG} already existed — notes updated."
          else
            gh release create "$TAG" \
              --title "Merge Cheer ${TAG}" \
              --notes-file "${RUNNER_TEMP}/notes.md" \
              --verify-tag
            echo "Created Release ${TAG}."
          fi

          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          echo "Marketplace edit: https://github.com/${GITHUB_REPOSITORY}/releases/edit/${TAG}"
          {
            echo "### Release ${TAG}"
            echo
            echo "Reviewed and published (create is idempotent if the tag"
            echo "Release already exists). Marketplace is still a browser tick"
            echo "on the first listing:"
            echo
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/edit/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Publish Docker Hub image
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve image tag
        id: ver
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image_tag=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ver.outputs.tag }}
          persist-credentials: false

      - name: Sanitize Docker Hub secrets
        id: hub
        env:
          RAW_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          RAW_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          USER="$(printf '%s' "${RAW_USER:-}" | sed 's/^\xEF\xBB\xBF//' | tr -d '\000-\010\013\014\016-\037\177' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          TOKEN="$(printf '%s' "${RAW_TOKEN:-}" | sed 's/^\xEF\xBB\xBF//' | tr -d '\000-\010\013\014\016-\037\177' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$USER" ] || [ -z "$TOKEN" ]; then
            echo "::error::Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets."
            exit 1
          fi
          case "$USER" in
            *@*)
              echo "::error::DOCKERHUB_USERNAME looks like an email; use the Hub username."
              exit 1
              ;;
            *:*)
              echo "::error::DOCKERHUB_USERNAME must not contain a colon (breaks Basic auth)."
              exit 1
              ;;
          esac
          if ! printf '%s' "$USER" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9_-]*$'; then
            echo "::error::DOCKERHUB_USERNAME has invalid characters for a Hub namespace."
            exit 1
          fi
          KIND=other
          case "$TOKEN" in
            dckr_pat_*) KIND=dckr_pat ;;
            ghp_*|github_pat_*) KIND=github_pat_wrong ;;
            *)
              if printf '%s' "$TOKEN" | grep -Eq '^[0-9a-fA-F-]{36}$'; then KIND=uuid_style; fi
              ;;
          esac
          if [ "$KIND" = "github_pat_wrong" ]; then
            echo "::error::DOCKERHUB_TOKEN looks like a GitHub token. Use a Docker Hub Access Token."
            exit 1
          fi
          PIPE_NS="$(sed -n 's/^image:[[:space:]]*\([^/:[:space:]]*\)\/.*/\1/p' pipe.yml | head -n1)"
          echo "username_len=${#USER} token_len=${#TOKEN} token_kind=${KIND} pipe_namespace=${PIPE_NS:-unknown}"
          if [ -n "${PIPE_NS:-}" ]; then
            USER_LC="$(printf '%s' "$USER" | tr '[:upper:]' '[:lower:]')"
            PIPE_LC="$(printf '%s' "$PIPE_NS" | tr '[:upper:]' '[:lower:]')"
            if [ "$USER_LC" != "$PIPE_LC" ]; then
              echo "::error::DOCKERHUB_USERNAME does not match pipe.yml image namespace (${PIPE_NS})."
              echo "::error::Update the secret to that Hub namespace (case-insensitive)."
              exit 1
            fi
            # Prefer pipe.yml casing for image tags (Hub namespaces are lowercase).
            if [ "$USER" != "$PIPE_NS" ]; then
              echo "Normalizing DOCKERHUB_USERNAME casing to pipe.yml (${PIPE_NS})."
              USER="$PIPE_NS"
            fi
          fi
          echo "::add-mask::$USER"
          echo "::add-mask::$TOKEN"
          echo "username=$USER" >> "$GITHUB_OUTPUT"
          {
            echo "DOCKERHUB_USERNAME<<EOF_HUB_USER"
            printf '%s\n' "$USER"
            echo "EOF_HUB_USER"
            echo "DOCKERHUB_TOKEN<<EOF_HUB_TOKEN"
            printf '%s\n' "$TOKEN"
            echo "EOF_HUB_TOKEN"
          } >> "$GITHUB_ENV"

      - name: Preflight Hub API login
        run: |
          set -euo pipefail
          BODY="$(jq -cn --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" '{username:$u,password:$p}')"
          CODE="$(curl -sS -o "${RUNNER_TEMP}/hub-login.json" -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "$BODY" \
            https://hub.docker.com/v2/users/login/ || true)"
          echo "hub_api_login_http=${CODE}"
          if [ "$CODE" != "200" ]; then
            MSG="$(jq -r '.message // .detail // empty' "${RUNNER_TEMP}/hub-login.json" 2>/dev/null || true)"
            echo "::error::Docker Hub rejected these credentials (HTTP ${CODE}). ${MSG}"
            echo "::error::Recreate a Hub Access Token (Read & Write) and set secrets with printf (not echo)."
            exit 1
          fi

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        run: |
          set -euo pipefail
          docker logout || true
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.hub.outputs.username }}/merge-cheer:${{ steps.ver.outputs.image_tag }}
            ${{ steps.hub.outputs.username }}/merge-cheer:latest
          provenance: false

      - name: Summary
        env:
          USER: ${{ steps.hub.outputs.username }}
          IMAGE_TAG: ${{ steps.ver.outputs.image_tag }}
          GIT_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          {
            echo "### Docker Hub"
            echo
            echo "- \`${USER}/merge-cheer:${IMAGE_TAG}\`"
            echo "- \`${USER}/merge-cheer:latest\`"
            echo
            echo "Bitbucket: \`pipe: docker://${USER}/merge-cheer:${IMAGE_TAG}\`"
            echo
            echo "Source tag: \`${GIT_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
