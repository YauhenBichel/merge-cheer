name: Merge Cheer
description: Zero-config GitHub Action that comments a G-rated celebration GIF when a pull request merges.
author: Yauhen Bichel
branding:
  icon: award
  color: purple

inputs:
  github-token:
    description: Token used to comment on the pull request.
    default: ${{ github.token }}
  topic:
    description: >
      GIF group. auto (default) picks a random theme, seeded by the
      pull request number so the same PR stays stable. Set a group
      name to pin that mood. title picks from the PR title and body.
      Groups: ship, fix, docs, tests, cleanup, celebration, welcome,
      party, space, magic, coffee, robot, comic, sunny, game, sticker,
      yeah, devops, sre, qa, design, architecture, engineering,
      backend, frontend, java, python, cpp, golang.
    required: false
    default: "auto"
  giphy-api-key:
    description: Optional Giphy key. When unset, the bundled GIFs are used.
    required: false
    default: ""
  message:
    description: >
      Comment text on merge. `{author}` is the pull request author.
      `{authors}` is the author plus unique human co-authors.
    default: "Merged — thank you @{author}."
  locale:
    description: >
      Language for the default thank-you when message is unset.
      en, es, de, fr, pt, uk. Unknown codes fall back to English.
      A pinned message, closed-message, or changes-message still wins.
    required: false
    default: "en"
  model:
    description: >
      Optional chat model. Empty keeps the stdlib path. Set an
      OpenAI-compatible model name with model-api-key. The model
      writes only the thank-you line. The GIF group stays from
      topic: auto is a random theme, title reads the PR title and
      body. The line must be about the pull request; generic thanks
      are ignored.
    required: false
    default: ""
  model-api-key:
    description: >
      Optional API key for an OpenAI-compatible /chat/completions
      endpoint. Empty skips the model unless model is github.
    required: false
    default: ""
  model-base-url:
    description: >
      Optional OpenAI-compatible API root (no /chat/completions
      suffix). GitHub Models is used when this is that host or
      model is github.
    required: false
    default: ""
  closed-topic:
    description: GIF group when a pull request closes without a merge. Default coffee.
    default: coffee
  closed-message:
    description: Comment text when a pull request closes without a merge.
    default: "Closed — thank you for the work @{author}."
  changes-topic:
    description: GIF group when a reviewer asks for more work. Default yeah.
    default: yeah
  changes-message:
    description: Comment text when a reviewer asks for more work.
    default: "A bit more work — you have this @{author}."
  rating:
    description: Giphy content rating when a key is set.
    default: "g"

runs:
  using: composite
  steps:
    - name: Comment a celebration GIF
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GIPHY_API_KEY: ${{ inputs.giphy-api-key }}
        GIPHY_RATING: ${{ inputs.rating }}
        MESSAGE: ${{ inputs.message }}
        LOCALE: ${{ inputs.locale }}
        TOPIC: ${{ inputs.topic }}
        CLOSED_TOPIC: ${{ inputs.closed-topic }}
        CLOSED_MESSAGE: ${{ inputs.closed-message }}
        CHANGES_TOPIC: ${{ inputs.changes-topic }}
        CHANGES_MESSAGE: ${{ inputs.changes-message }}
        EVENT_NAME: ${{ github.event_name }}
        PR_MERGED: ${{ github.event.pull_request.merged }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        MODEL: ${{ inputs.model }}
        MODEL_API_KEY: ${{ inputs.model-api-key }}
        MODEL_BASE_URL: ${{ inputs.model-base-url }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REVIEW_STATE: ${{ github.event.review.state }}
        REVIEW_AUTHOR: ${{ github.event.review.user.login }}
        REVIEW_AUTHOR_TYPE: ${{ github.event.review.user.type }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        ACTION_REPO: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
        ACTION_PATH: ${{ github.action_path }}
      run: python3 "${{ github.action_path }}/src/celebrate.py"
