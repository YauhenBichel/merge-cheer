# Add repository secret ANTHROPIC_API_KEY using a key scoped to a single Anthropic workspace.
# Errors or unsafe replies fall back to the default thank-you.
name: Celebrate merge with Anthropic
on:
  pull_request_target:
    types: [closed]
permissions:
  pull-requests: write
jobs:
  celebrate:
    if: github.event.pull_request.merged && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: YauhenBichel/merge-cheer@v1.7.0
        with:
          model: claude-haiku-4-5-20251001
          model-base-url: https://api.anthropic.com/v1
          model-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
