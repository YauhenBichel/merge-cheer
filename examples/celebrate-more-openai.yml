# Closed and changes, plus one model line about the pull request.
# The GIF group still comes from closed-topic / changes-topic, not
# from the model. Stdlib-only copy: examples/celebrate-more.yml.
#
# Settings → Secrets → Actions → New repository secret:
#   Name: OPENAI_API_KEY
#   Value: your OpenAI (or OpenAI-compatible) key
#
# @v1.7.0 drops generic thanks.

name: Celebrate merge
on:
  pull_request_target:
    types: [closed]
  pull_request_review:
    types: [submitted]
permissions:
  pull-requests: write
jobs:
  celebrate:
    if: >
      github.event.pull_request.user.type != 'Bot'
      && (
        github.event_name != 'pull_request_review'
        || (
          github.event.review.state == 'changes_requested'
          && github.event.review.user.type != 'Bot'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: YauhenBichel/merge-cheer@v1.7.0
        with:
          model: gpt-4o-mini
          model-api-key: ${{ secrets.OPENAI_API_KEY }}
          # closed-topic: coffee
          # changes-topic: yeah
