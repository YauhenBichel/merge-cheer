# Optional. Merge-only is still examples/celebrate-merge.yml.
# This file also comments when a PR closes without a merge, and
# when a reviewer asks for more work. Tone stays kind. Bots skipped.
name: Celebrate merge
on:
  pull_request_target:
    types: [closed]
  pull_request_review:
    types: [submitted]
permissions:
  pull-requests: write
jobs:
  celebrate:
    if: >
      github.event.pull_request.user.type != 'Bot'
      && (
        github.event_name != 'pull_request_review'
        || (
          github.event.review.state == 'changes_requested'
          && github.event.review.user.type != 'Bot'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: YauhenBichel/merge-cheer@v1.6.0
        with:
          # closed-topic: coffee
          # changes-topic: yeah
