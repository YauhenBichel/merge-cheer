# Consumer pipeline. After you mirror merge-cheer to GitLab and publish
# a catalog release, switch the include to that catalog path@version.
#
# include:
#   - component: $CI_SERVER_FQDN/YauhenBichel/merge-cheer/merge-cheer@v1.7.0
#     inputs:
#       topic: auto
#       token: $GITLAB_TOKEN

celebrate:
  image: python:3.13-alpine
  stage: .post
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  variables:
    TOPIC: auto
    ACTION_REF: v1.7.0
    # SHA-256 of celebrate.py from the release notes. The script runs with your
    # token, so pin it: the job then refuses any other file.
    ACTION_SHA256: ""
    ACTION_REPO: YauhenBichel/merge-cheer
  script:
    - apk add --no-cache curl
    - curl -fsSL "https://raw.githubusercontent.com/YauhenBichel/merge-cheer/${ACTION_REF}/src/celebrate.py" -o /tmp/celebrate.py
    - if [ -n "$ACTION_SHA256" ]; then echo "$ACTION_SHA256  /tmp/celebrate.py" | sha256sum -c -; fi
    - python3 /tmp/celebrate.py
