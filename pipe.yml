name: Merge Cheer
image: eugenebichel/merge-cheer:1.6.0
description: Comment a G-rated celebration GIF when a pull request merges. No Giphy key.
category: Utilities
repository: https://github.com/YauhenBichel/merge-cheer
maintainer:
  name: Yauhen Bichel
  website: https://github.com/YauhenBichel/merge-cheer
tags:
  - pull-request
  - gif
  - celebration
variables:
  - name: BITBUCKET_ACCESS_TOKEN
    description: Repository access token with pullrequest write.
  - name: TOPIC
    default: auto
    description: GIF group. auto picks a random theme. Pin python, devops, comic, …
  - name: MESSAGE
    default: "Merged — thank you @{author}."
  - name: LOCALE
    default: en
    description: Default thank-you language. en, es, de, fr, pt, uk. Unknown codes fall back to English.
  - name: ACTION_REF
    default: v1.6.0
  - name: GIPHY_API_KEY
    default: ""
