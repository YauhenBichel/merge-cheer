spec:
  inputs:
    topic:
      default: auto
      description: GIF group. auto picks a random theme. Pin python, devops, comic, …
    message:
      default: "Merged — thank you @{author}."
      description: Comment text. `{author}` becomes the merge request author.
    locale:
      default: en
      description: Default thank-you language. en, es, de, fr, pt, uk, it, be, ja. Unknown codes fall back to English.
    action_ref:
      default: v1.7.0
      description: merge-cheer tag or commit used to download celebrate.py and GIF URLs.
    action_sha256:
      default: ""
      description: SHA-256 of celebrate.py from the release notes. When set, the job refuses any other file. The script runs with your token, so set it.
    token:
      default: $GITLAB_TOKEN
      description: Project access token with api scope. CI_JOB_TOKEN cannot post notes.
---
celebrate:
  image: python:3.13-alpine
  stage: .post
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  variables:
    TOPIC: $[[ inputs.topic ]]
    MESSAGE: $[[ inputs.message ]]
    LOCALE: $[[ inputs.locale ]]
    ACTION_REF: $[[ inputs.action_ref ]]
    ACTION_SHA256: $[[ inputs.action_sha256 ]]
    ACTION_REPO: YauhenBichel/merge-cheer
    GITLAB_TOKEN: $[[ inputs.token ]]
  script:
    - apk add --no-cache curl
    - curl -fsSL "https://raw.githubusercontent.com/YauhenBichel/merge-cheer/${ACTION_REF}/src/celebrate.py" -o /tmp/celebrate.py
    - if [ -n "$ACTION_SHA256" ]; then echo "$ACTION_SHA256  /tmp/celebrate.py" | sha256sum -c -; fi
    - python3 /tmp/celebrate.py
